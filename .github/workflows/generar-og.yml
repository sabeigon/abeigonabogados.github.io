name: Generar imágenes Open Graph
on:
  push:
    paths:
      - 'assets/social/*.svg'
      - '.github/workflows/generar-og.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  social_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor SVG
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Generar imágenes PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for source in Path('assets/social').glob('og-*.svg'):
              target = Path('assets/img') / f'{source.stem}.png'
              cairosvg.svg2png(url=str(source), write_to=str(target), output_width=1200, output_height=630)
              print(f'{source} -> {target}')
          PY
      - name: Guardar imágenes generadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/og-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generar imágenes PNG Open Graph 1200x630'
            git push
          fi
